<!doctype html><html><head><meta charset="utf-8"><title>SpareCycle</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#e8edf7;font:15px system-ui,sans-serif}header{padding:30px 7%;border-bottom:1px solid #25314d}h1{margin:0;color:#83d1ff}.sub{color:#9cabc5}.grid{padding:25px 7%;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.card{background:#131c31;border:1px solid #263451;border-radius:12px;padding:18px}.value{font-size:28px;font-weight:700}.ok{color:#59d99d}.bad{color:#ff6f7c}progress{width:100%;accent-color:#61b8ff}small{color:#a8b4c9}button,select,input{margin:4px;padding:7px}</style></head><body><header><h1>SpareCycle</h1><div class="sub">Local distributed compute pool · live hardware telemetry</div></header><section class="grid" id="summary"></section><section class="grid" id="workers"></section><section class="grid"><div class="card"><h2>Submit CSV</h2><input id="file" type="file" accept=".csv"><select id="strategy"><option value="weighted">Weighted</option><option value="least_loaded">Least loaded</option><option value="round_robin">Round robin</option></select><button onclick="submitCsv()">Submit</button><div id="notice"></div></div><div class="card"><h2>Jobs</h2><div id="jobs">Loading…</div></div></section><script>
function bar(v){return `<progress max="100" value="${v||0}"></progress> ${(+v||0).toFixed(1)}%`};async function load(){let s=await (await fetch('/api/state')).json(),w=s.workers;document.querySelector('#summary').innerHTML=`<div class=card><small>Connected laptops</small><div class=value>${w.filter(x=>x.connected).length}</div></div><div class=card><small>Available RAM</small><div class=value>${(w.reduce((a,x)=>a+(x.metrics?.available_ram||0),0)/1e9).toFixed(1)} GB</div></div><div class=card><small>Scheduling default</small><div class=value>Weighted</div></div>`;document.querySelector('#workers').innerHTML=w.map(x=>`<div class=card><h2 class=${x.connected?'ok':'bad'}>${x.name}</h2><small>${x.id} · ${x.connected?'connected':'offline'}</small><p>CPU ${bar(x.metrics?.cpu_percent)}</p><p>RAM ${bar(x.metrics?.ram_percent)}</p><small>${x.metrics?.logical_cores||0} logical cores · ${((x.metrics?.available_ram||0)/1e9).toFixed(1)} GB free · ${x.active_tasks} active tasks</small></div>`).join('')||'<div class=card>No workers connected. Start one with the coordinator IP and port.</div>';document.querySelector('#jobs').innerHTML=s.jobs.map(j=>`<p><b>${j.name}</b> — ${j.status} (${Object.values(j.tasks||{}).filter(t=>t.status==='completed').length}/${j.total||0})</p>`).join('No jobs submitted yet.');}async function submitCsv(){let f=file.files[0];if(!f)return;notice.textContent='Uploading';let b=new Uint8Array(await f.arrayBuffer()),s='';for(let x of b)s+=String.fromCharCode(x);let r=await fetch('/api/jobs/csv',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.name,data:btoa(s),strategy:strategy.value})});notice.textContent=r.ok?'Submitted':await r.text();load()}load();setInterval(load,1500)</script></body></html>
